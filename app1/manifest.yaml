apiVersion: apps/v1
kind: Deployment

metadata:
  name: app1
  labels:
    purpose: ingress
    project: roboshop
    app: app1

spec:
  replicas: 2

  selector:
    matchLabels:
      purpose: ingress
      project: roboshop
      app: app1

  template:
    metadata:
      labels:
        purpose: ingress
        project: roboshop
        app: app1

    spec:
      containers:
        - name: app1
          image: lakshmi1092/app1:v1
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    purpose: ingress
    project: roboshop
    app: app1
spec:
  selector:
    purpose: ingress
    project: roboshop
    app: app1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  purpose: ingress
  project: roboshop
  app: app1
  annotations:
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:352742379477:certificate/bc9c2cf3-00d8-400c-af1a-7209ad14e248
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

spec:
  ingressClassName: alb

  rules:
    # Request for app1.nagalakshmi.site
    - host: app1.nagalakshmi.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1
                port:
                  number: 80

  